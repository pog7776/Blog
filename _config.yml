# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
# If it has the same name as one of the files in folder `_data/locales`, the layout language will also be changed,
# otherwise, the layout language will use the default value of 'en'.
lang: en

# Change to your timezone › https://zones.arilyn.cc
timezone: Australia/Sydney

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: TrickleCharge # the main title

tagline: Typing... # it will display as the subtitle

description: >- # used by seo meta and the atom feed
  pog7776 is typing...

# Fill in the protocol & hostname for your site.
# E.g. 'https://username.github.io', note that it does not end with a '/'.
url: "https://blog.tricklecharge.dev"

github:
  username: pog7776 # change to your GitHub username

twitter:
  username: pog7776 # change to your Twitter username

social:
  # Change to your full name.
  # It will be displayed as the default author of the posts and the copyright owner in the Footer
  name: Jack Cooper
  email: jack.cooper7776@gmail.com # change to your email address
  fediverse_handle: # fill in your fediverse handle. E.g. "@username@domain.com"
  links:
    # The first element serves as the copyright owner's link
    - https://github.com/pog7776 # change to your GitHub homepage
    - https://twitter.com/pog7776 # change to your Twitter homepage
    # Uncomment below to add more social links
    # - https://www.facebook.com/username
    # - https://www.linkedin.com/in/username

# Site Verification Settings
webmaster_verifications:
  google: # fill in your Google verification code
  bing: # fill in your Bing verification code
  alexa: # fill in your Alexa verification code
  yandex: # fill in your Yandex verification code
  baidu: # fill in your Baidu verification code
  facebook: # fill in your Facebook verification code

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings
analytics:
  google:
    id: G-5RXK7JBGF6 # fill in your Google Analytics ID
  goatcounter:
    id: # fill in your GoatCounter ID
  umami:
    id: # fill in your Umami ID
    domain: # fill in your Umami domain
  matomo:
    id: # fill in your Matomo ID
    domain: # fill in your Matomo domain
  cloudflare:
    id: # fill in your Cloudflare Web Analytics token
  fathom:
    id: # fill in your Fathom Site ID

# Page views settings
pageviews:
  provider: # now only supports 'goatcounter'

# Prefer color scheme setting.
#
# Note: Keep empty will follow the system prefer color by default,
# and there will be a toggle to switch the theme between dark and light
# on the bottom left of the sidebar.
#
# Available options:
#
#     light — Use the light color scheme
#     dark — Use the dark color scheme
#
theme_mode: # [light | dark]

# The CDN endpoint for media resources.
# Notice that once it is assigned, the CDN url
# will be added to all media resources (site avatar, posts' images, audio and video files) paths starting with '/'
#
# e.g. 'https://cdn.com'
cdn:

# the avatar on sidebar, support local or CORS resources
avatar: https://avatars.githubusercontent.com/u/37564169

# The URL of the site-wide social preview image used in SEO `og:image` meta tag.
# It can be overridden by a customized `page.image` in front matter.
social_preview_image: https://avatars.githubusercontent.com/u/37564169 # string, local or CORS resources

# boolean type, the global switch for TOC in posts.
toc: true

comments:
  # Global switch for the post-comment system. Keeping it empty means disabled.
  provider: giscus # [disqus | utterances | giscus]
  # The provider options are as follows:
  disqus:
    shortname: # fill with the Disqus shortname. › https://help.disqus.com/en/articles/1717111-what-s-a-shortname
  # utterances settings › https://utteranc.es/
  utterances:
    repo: # <gh-username>/<repo>
    issue_term: # < url | pathname | title | ...>
  # Giscus options › https://giscus.app
  giscus:
    repo: pog7776/Blog # <gh-username>/<repo>
    repo_id: R_kgDOM6J1-A
    category: Comments
    category_id: DIC_kwDOM6J1-M4C-ZAV
    mapping: title # optional, default to 'pathname'
    strict: 1 # optional, default to '0'
    input_position: # optional, default to 'bottom'
    lang: # optional, default to the value of `site.lang`
    reactions_enabled: # optional, default to the value of `1`

# Self-hosted static assets, optional › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # boolean, keep empty means false
    # specify the Jekyll environment, empty means both
    # only works if `assets.self_host.enabled` is 'true'
    env: # [development | production]

pwa:
  enabled: true # The option for PWA feature (installable)
  cache:
    enabled: true # The option for PWA offline cache
    # Paths defined here will be excluded from the PWA cache.
    # Usually its value is the `baseurl` of another website that
    # shares the same domain name as the current website.
    deny_paths:
      # - "/example"  # URLs match `<SITE_URL>/example/*` will not be cached by the PWA

paginate: 10

# The base URL of your site
baseurl: ""

# AI Visible Content › https://github.com/madmatvey/jekyll-ai-visible-content
ai_visible_content:
  enabled: true                              # Master switch

  # --- Entity Identity ---
  entity:
    type: Person                             # Person | Organization
    name: "Jack Cooper"
    alternate_names:                          # Other name forms (translations, etc.)
      - "pog7776"
    job_title: "Software Developer"
    description: "I spend a lot of time in Unity"
    image: https://avatars.githubusercontent.com/u/37564169             # Relative or absolute URL
    email: jack.cooper7776@gmail.com
    location:
      locality: "Sydney"
      country: "AU"                          # ISO 3166-1 alpha-2
    knows_about:                             # Skills/topics (used for entity linking too)
      - Unity
      - C#
      - Dotnet
      - Game Development
    same_as:                                 # Links to authoritative profiles
      - https://github.com/pog7776
      - https://twitter.com/pog7776
    occupation:
      name: "Software Developer"
      location_country: "Australia"
      skills: "C#, Unity, Game Development"

  # --- JSON-LD Behavior ---
  json_ld:
    auto_inject: true                        # Inject into <head> via hook (no manual tag needed)
    include_website_schema: true             # WebSite + SearchAction on homepage
    include_breadcrumbs: true                # BreadcrumbList on all pages
    include_blog_posting: true               # BlogPosting on dated posts
    include_faq: true                        # FAQPage when faq: in front matter
    include_how_to: true                     # HowTo when how_to: in front matter
    article_body: excerpt                    # none | excerpt | full
    compact: false                           # Minify JSON-LD output

  # --- AI Crawler Policies ---
  crawlers:
    allow_gptbot: true
    allow_perplexitybot: true
    allow_claudebot: true
    allow_googlebot: true
    allow_bingbot: true
    custom_rules: []                         # [{user_agent: "Bot", directive: "Allow", path: "/"}]
    generate_robots_txt: true

  # --- llms.txt ---
  llms_txt:
    enabled: true
    title: null                              # Defaults to site.title
    description: null                        # Defaults to site.description
    sections: []                             # [{heading: "Section", content: "text"}]
    include_full_text: true                  # Also generate /llms-full.txt

  # --- Internal Linking ---
  linking:
    enable_entity_links: true                # Auto-link known entities in post body
    apply_to_metadata: false                 # Safe default: never inject <a> into head/SEO/JSON-LD/feed fields
    entity_definitions: {}                   # Custom: slug -> {name, url, description}
    max_links_per_entity_per_post: 1
    enable_related_posts: true
    related_posts_limit: 3

  # --- Validation ---
  validation:
    warn_name_inconsistency: true
    warn_missing_same_as: true
    warn_missing_dates: true
    warn_orphan_pages: true
    warn_missing_descriptions: true
    fail_build_on_error: false               # true = exit 1 on validation failure
    content_only: true                       # Only validate authored HTML content pages
    exclude_paths: []                        # Glob patterns to skip: ["/custom/*", "/drafts/*"]
    verbose: false                           # true = show every warning; false = grouped summary
    max_examples: 3                          # Max examples per warning group in summary mode

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-ai-visible-content

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
